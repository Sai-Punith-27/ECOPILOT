services:
  backend:
    build:
      context: .
      dockerfile: backend/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/backend/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  simulator:
    build:
      context: ./backend/simulator
    restart: unless-stopped
    environment:
      - BACKEND_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
